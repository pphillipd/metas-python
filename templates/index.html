<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Metas</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .tarefa { border-bottom: 1px solid #eee; padding: 10px 0; }
        .prazo { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cadastrar Novo Prazo</h1>
        <form method="POST">
            <label>O que precisa ser feito?</label>
            <input type="text" name="titulo" required placeholder="Ex: Entregar lote de roupas">
            
            <label>Qual a data e hora limite?</label>
            <input type="datetime-local" name="prazo" required>
            
            <button type="submit">Salvar Prazo</button>
        </form>

        <h2>Prazos Ativos</h2>
        <div id="lista-tarefas">
            {% for t in tarefas %}
            <div class="tarefa">
                <strong>{{ t.titulo }}</strong><br>
                Vence em: <span class="prazo">{{ t.prazo.replace('T', ' às ') }}</span>
            </div>
            {% else %}
            <p>Nenhuma tarefa cadastrada ainda.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
